<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FusionTTS — Interactive demo</title>
<link rel="stylesheet" href="../static/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../static/css/style.css">
<link rel="stylesheet" href="../static/css/tour.css">
<link rel="stylesheet" href="demo.css">
<script>window.FTTS_DEMO = true;</script>
<script src="mock-api.js"></script>
</head>
<body>
<div class="demo-banner">
  <span class="demo-badge">Demo</span>
  <span class="demo-text">
    Interactive preview — the LLM and TTS are simulated, nothing is saved.
    <a href="https://github.com/TheLastWardian/FusionTTS" target="_blank" rel="noopener">Get the full app</a>
  </span>
  <button id="btn-replay-tour" class="demo-replay" type="button">Replay tour</button>
</div>
<div class="app" id="app">

  <!-- Topbar -->
  <header class="topbar">
    <span class="tb-brand">FusionTTS</span>
    <span class="tb-room" id="tb-room">
      <i class="ti ti-messages" title="Current room (switch from the menu)"></i>
      <span id="room-label" title="Current room (switch from the menu)">…</span>
    </span>
    <div id="tts-chip" class="tts-chip" title="Click to toggle TTS">
      <div class="tts-wave" id="tts-wave">
        <div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>
      </div>
      <span id="tts-label">TTS · off</span>
    </div>
    <div class="tts-controls" id="tts-ctrl">
      <button class="tts-btn" id="btn-tts-pause" title="Pause" aria-label="Pause TTS" disabled><i class="ti ti-player-pause"></i></button>
      <button class="tts-btn" id="btn-tts-stop" title="Stop" aria-label="Stop TTS" disabled><i class="ti ti-player-stop"></i></button>
    </div>
    <div class="tb-right">
      <span class="ctx-usage" id="ctx-usage">
        <span class="ctx-dot" id="ctx-dot"></span>
        <span class="ctx-num" id="ctx-num">—</span>
      </span>
      <button class="tb-icon tb-icon-sm" id="btn-compact" title="Compact context: summarizes the conversation (the last 10 messages are kept) so it doesn't exhaust the LLM window" aria-label="Compact context">
        <i class="ti ti-archive"></i>
      </button>
      <button class="tb-icon tb-icon-sm" id="btn-clear-room" title="Clear all context in this room" aria-label="Clear room chat">
        <i class="ti ti-trash"></i>
      </button>
      <button class="tb-icon" id="btn-theme" title="Switch theme" aria-label="Switch theme">
        <i class="ti ti-moon" id="theme-icon"></i>
      </button>
      <button class="tb-icon" id="btn-settings" title="Config" aria-label="Config">
        <i class="ti ti-settings"></i>
      </button>
    </div>
  </header>

  <!-- Gutter izquierdo (resize + colapso) -->
  <div class="gutter gutter-left" id="gutter-left">
    <button class="gutter-btn" id="btn-collapse-left" title="Collapse panel" aria-label="Collapse left panel">
      <i class="ti ti-chevrons-left"></i>
    </button>
  </div>

  <!-- Left sidebar -->
  <aside class="left" id="left">
    <div class="section-head">
      <span>Personas</span>
      <button id="btn-new-folder" title="New folder" aria-label="New folder"><i class="ti ti-folder-plus"></i></button>
      <div class="col-toggle" id="col-toggle" title="Grid columns">
        <button data-cols="1" title="1 column">1</button>
        <button data-cols="2" title="2 columns">2</button>
        <button data-cols="3" title="3 columns">3</button>
        <button data-cols="4" title="4 columns">4</button>
      </div>
    </div>
    <div class="persona-list" id="persona-list"></div>
    <div class="split-h" id="gutter-rooms" title="Drag to resize Rooms"></div>
    <div class="rooms-section">
      <div class="section-head section-head-plain">Rooms</div>
      <div id="room-list"></div>
      <div class="room-form" id="room-form" hidden>
        <div class="room-form-inner">
          <input type="text" id="room-name" placeholder="room name" maxlength="64" spellcheck="false">
          <button class="room-form-btn" id="room-form-ok" title="Create room" aria-label="Create room"><i class="ti ti-check"></i></button>
          <button class="room-form-btn room-form-cancel" id="room-form-cancel" title="Cancel" aria-label="Cancel"><i class="ti ti-x"></i></button>
        </div>
        <div class="persona-checks" id="room-form-personas"></div>
      </div>
      <button class="room-item" id="btn-new-room"><i class="ti ti-plus"></i> New room</button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <div class="messages" id="messages">
      <div class="empty-state">
        <i class="ti ti-messages"></i>
        <span>No messages yet</span>
      </div>
    </div>

    <div class="input-area">
      <div class="image-preview hidden" id="image-preview"></div>
      <div class="input-row" id="input-row">
        <div class="input-wrap">
          <div class="input-who">
            <span class="input-who-label">Who answers:</span>
            <span id="who-chips"></span>
          </div>
          <textarea class="chat-input" id="chat-input" placeholder="Type a message… (Enter to send, ctrl+V or drag an image)" rows="1"></textarea>
        </div>
        <input type="file" id="image-input" accept="image/*" hidden>
        <div class="input-actions">
          <button class="send-btn image-btn" id="btn-image" aria-label="Attach image" title="Attach image (also ctrl+V or drag to the chat)"><i class="ti ti-photo"></i></button>
          <button class="send-btn" id="btn-send" aria-label="Send message" title="Send"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </div>
  </main>

  <!-- Gutter derecho (resize + colapso) -->
  <div class="gutter gutter-right" id="gutter-right">
    <button class="gutter-btn" id="btn-collapse-right" title="Collapse panel" aria-label="Collapse right panel">
      <i class="ti ti-chevrons-right"></i>
    </button>
  </div>

  <!-- Right panel -->
  <aside class="right" id="right">
    <div class="right-tabs">
      <button class="rtab active" id="tab-llm">LLM</button>
      <button class="rtab" id="tab-tts">TTS</button>
      <button class="rtab" id="tab-personas">Add persona</button>
    </div>
    <div class="rpanel active" id="rpanel-llm"></div>
    <div class="rpanel" id="rpanel-tts"></div>
    <div class="rpanel" id="rpanel-personas"></div>
  </aside>

</div>
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="toasts" id="toasts"></div>
<div class="api-banner" id="api-banner">Could not connect to the API</div>
<script>
  document.getElementById("btn-replay-tour").addEventListener("click", () => {
    if (window.FusionTour) window.FusionTour.start("demo");
  });
</script>
<script>
  // tutorial de creacion de personajes: caja informativa + voz de muestra
  // que dispara el flujo real del app (mock) de punta a punta.
  (function () {
    "use strict";
    const panel = document.getElementById("rpanel-personas");
    function inject() {
      const drop = panel.querySelector(".drop-zone");
      if (!drop || drop.classList.contains("busy")) return;
      if (drop.previousElementSibling && drop.previousElementSibling.classList.contains("demo-create-hint")) return;
      const box = document.createElement("div");
      box.className = "demo-create-hint";
      box.innerHTML =
        '<div class="dch-title">How character creation works</div>' +
        "<ol>" +
        "<li>Drop a <b>.wav</b> voice sample. The name comes from the file: <code>Name.wav</code>, <code>Name_Eng.wav</code> or <code>Name_Latino.wav</code>.</li>" +
        "<li>The app transcribes it with a local ASR model.</li>" +
        "<li>If an LLM is loaded, it writes the character sheet on its own — description, system prompt, color and language. You review and edit everything before accepting, or re-generate it.</li>" +
        "<li>Accept, and the character appears in the sidebar with its cloned voice.</li>" +
        "</ol>" +
        '<div class="dch-note">In this demo every step is simulated; nothing leaves your browser.</div>';
      const btn = document.createElement("button");
      btn.className = "dch-btn";
      btn.type = "button";
      btn.textContent = "Try it with a sample voice";
      btn.addEventListener("click", () => {
        const input = panel.querySelector(".drop-zone input[type=file]");
        if (!input) return;
        const dt = new DataTransfer();
        dt.items.add(new File([new Uint8Array(2048)], "Nova.wav", { type: "audio/wav" }));
        input.files = dt.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
      box.appendChild(btn);
      panel.insertBefore(box, drop);
    }
    new MutationObserver(inject).observe(panel, { childList: true });
    inject();
  })();
</script>
<script src="../static/js/sse.js"></script>
<script src="../static/js/audio-queue.js"></script>
<script src="../static/js/chips-fit.js"></script>
<script type="module" src="../static/js/app.js"></script>
</body>
</html>
