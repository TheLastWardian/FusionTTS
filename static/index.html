<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FusionTTS</title>
<link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">

  <!-- Topbar -->
  <header class="topbar">
    <button class="tb-icon tb-menu" id="btn-menu" title="Menú" aria-label="Abrir menú">
      <i class="ti ti-menu-2"></i>
    </button>
    <span class="tb-brand">FusionTTS</span>
    <span class="tb-room" id="tb-room">
      <i class="ti ti-messages" title="Room actual (cambiá desde el menú)"></i>
      <span id="room-label" title="Room actual (cambiá desde el menú)">…</span>
      <span class="ctx-usage" id="ctx-usage" hidden>
        <span class="ctx-dot" id="ctx-dot"></span>
        <span class="ctx-num" id="ctx-num">—</span>
      </span>
      <button class="tb-icon tb-icon-sm" id="btn-compact" title="Compactar contexto: resume la conversacion (quedan los ultimos 10 mensajes) para no agotar la ventana del LLM" aria-label="Compactar contexto">
        <i class="ti ti-minimize"></i>
      </button>
      <button class="tb-icon tb-icon-sm" id="btn-clear-room" title="Borrar todo el contexto de esta room" aria-label="Borrar chat de la room">
        <i class="ti ti-trash"></i>
      </button>
    </span>
    <div class="tb-right">
      <div id="tts-chip" class="tts-chip" title="Click para encender/apagar TTS">
        <div class="tts-wave" id="tts-wave">
          <div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>
        </div>
        <span id="tts-label">TTS · off</span>
      </div>
      <div class="tts-controls" id="tts-ctrl">
        <button class="tts-btn" id="btn-tts-pause" title="Pausar" aria-label="Pausar TTS" disabled><i class="ti ti-player-pause"></i></button>
        <button class="tts-btn" id="btn-tts-stop" title="Detener" aria-label="Detener TTS" disabled><i class="ti ti-player-stop"></i></button>
      </div>
      <button class="tb-icon" id="btn-theme" title="Cambiar tema" aria-label="Cambiar tema">
        <i class="ti ti-moon" id="theme-icon"></i>
      </button>
      <button class="tb-icon" id="btn-settings" title="Config" aria-label="Config">
        <i class="ti ti-settings"></i>
      </button>
    </div>
  </header>

  <!-- Gutter izquierdo (resize + colapso) -->
  <div class="gutter gutter-left" id="gutter-left">
    <button class="gutter-btn" id="btn-collapse-left" title="Colapsar panel" aria-label="Colapsar panel izquierdo">
      <i class="ti ti-chevrons-left"></i>
    </button>
  </div>

  <!-- Left sidebar -->
  <aside class="left" id="left">
    <div class="section-head">
      Personas
    </div>
    <div class="persona-list" id="persona-list"></div>
    <div class="split-h" id="gutter-rooms" title="Arrastrar para redimensionar Rooms"></div>
    <div class="rooms-section">
      <div class="section-head section-head-plain">Rooms</div>
      <div id="room-list"></div>
      <div class="room-form" id="room-form" hidden>
        <div class="room-form-inner">
          <input type="text" id="room-name" placeholder="nombre del room" maxlength="64" spellcheck="false">
          <button class="room-form-btn" id="room-form-ok" title="Crear room" aria-label="Crear room"><i class="ti ti-check"></i></button>
          <button class="room-form-btn room-form-cancel" id="room-form-cancel" title="Cancelar" aria-label="Cancelar"><i class="ti ti-x"></i></button>
        </div>
        <div class="persona-checks" id="room-form-personas"></div>
      </div>
      <button class="room-item" id="btn-new-room"><i class="ti ti-plus"></i> New room</button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <div class="messages" id="messages">
      <div class="empty-state">
        <i class="ti ti-messages"></i>
        <span>Sin mensajes todavía</span>
      </div>
    </div>

    <div class="input-area">
      <div class="image-preview hidden" id="image-preview"></div>
      <div class="input-row" id="input-row">
        <div class="input-wrap">
          <div class="input-who">
            <span class="input-who-label">Responde:</span>
            <span id="who-chips"></span>
          </div>
          <textarea class="chat-input" id="chat-input" placeholder="Escribí un mensaje… (Enter para enviar, ctrl+V o arrastrar una imagen)" rows="1"></textarea>
        </div>
        <input type="file" id="image-input" accept="image/*" hidden>
        <button class="send-btn image-btn" id="btn-image" aria-label="Adjuntar imagen" title="Adjuntar imagen (también ctrl+V o arrastrar al chat)"><i class="ti ti-image"></i></button>
        <button class="send-btn" id="btn-send" aria-label="Enviar mensaje" title="Enviar"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </main>

  <!-- Gutter derecho (resize + colapso) -->
  <div class="gutter gutter-right" id="gutter-right">
    <button class="gutter-btn" id="btn-collapse-right" title="Colapsar panel" aria-label="Colapsar panel derecho">
      <i class="ti ti-chevrons-right"></i>
    </button>
  </div>

  <!-- Right panel -->
  <aside class="right" id="right">
    <div class="right-tabs">
      <button class="rtab active" id="tab-llm">LLM</button>
      <button class="rtab" id="tab-tts">TTS</button>
      <button class="rtab" id="tab-personas">Añadir persona</button>
    </div>
    <div class="rpanel active" id="rpanel-llm"></div>
    <div class="rpanel" id="rpanel-tts"></div>
    <div class="rpanel" id="rpanel-personas"></div>
  </aside>

</div>
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="toasts" id="toasts"></div>
<div class="api-banner" id="api-banner">No se pudo conectar al API</div>
<script src="js/sse.js"></script>
<script src="js/audio-queue.js"></script>
<script src="js/chips-fit.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
